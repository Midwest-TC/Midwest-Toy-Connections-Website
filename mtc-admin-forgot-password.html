<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Midwest Toy Connections</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="mtc-admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="mtc-admin-password.js" defer></script>
</head>
<body>
    <main class="mtc-password-recovery-page">
        <div class="mtc-password-recovery-blue-glow"></div>
        <div class="mtc-password-recovery-purple-glow"></div>
        <section class="mtc-password-recovery-shell">
            <div class="mtc-password-recovery-brand">
                <div class="mtc-password-recovery-mark">MTC</div>
                <div class="mtc-password-recovery-brand-copy">
                    <strong>Midwest Toy Connections</strong>
                    <span>Admin Portal</span>
                </div>
            </div>
            <div class="mtc-password-recovery-card">
                <div class="mtc-password-recovery-heading">
                    <div class="mtc-password-recovery-key-icon">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <h1>Forgot your password?</h1>
                    <p>Enter the email address associated with your staff account and we'll send you a secure password reset link.</p>
                </div>
                <form id="mtcPasswordRecoveryForm">
                    <div class="mtc-password-recovery-field">
                        <label for="mtcPasswordRecoveryEmail">Email Address</label>
                        <div class="mtc-password-recovery-input">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="mtcPasswordRecoveryEmail" placeholder="name@example.com" autocomplete="email" required>
                        </div>
                    </div>
                    <div class="mtc-password-recovery-message" id="mtcPasswordRecoveryMessage"></div>
                    <button type="submit" class="mtc-password-recovery-button" id="mtcPasswordRecoveryButton">
                        <span>Send Reset Link</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
                <a href="mtc-admin-login.html" class="mtc-password-recovery-back">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Admin Login</span>
                </a>
                <div class="mtc-password-recovery-secure">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Secure staff account recovery</span>
                </div>
            </div>
            <p class="mtc-password-recovery-footer">© Midwest Toy Connections</p>
        </section>
    </main>
</body>
</html>
